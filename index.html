<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solayer Pay — Frog Voice Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <!-- Satoshi (primary brand font, matches the Solayer app Figma file) -->
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,600,700,900&display=swap" rel="stylesheet">
  <!-- Geist as fallback / monospace -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="agent.css" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; height: 100%; }
    html { background: #050606; }
    body {
      font-family: 'Satoshi', 'Geist', -apple-system, system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(0,255,163,0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 80%, #0a0a0c 0%, transparent 50%),
        #050606;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    body.theme-solayerAI {
      background:
        radial-gradient(ellipse at 50% 0%, rgba(0,255,163,0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 80%, #0a0a0c 0%, transparent 50%),
        #050606;
    }
    body.theme-indigo {
      background:
        radial-gradient(ellipse at 50% 0%, #1d1856 0%, transparent 55%),
        radial-gradient(ellipse at 70% 80%, #0a0820 0%, transparent 50%),
        #050416;
    }
    body.theme-cosmic {
      background:
        radial-gradient(ellipse at 30% 20%, #1c1a3a 0%, transparent 55%),
        radial-gradient(ellipse at 70% 80%, #0e0b22 0%, transparent 50%),
        #07061a;
    }
    body.theme-lily {
      background:
        radial-gradient(ellipse at 30% 20%, #e4efd5 0%, transparent 55%),
        radial-gradient(ellipse at 70% 80%, #d8e6c0 0%, transparent 50%),
        #e7efd6;
    }
    #root { width: 100%; display: flex; align-items: center; justify-content: center; }

    /* mic-prompt banner */
    .mic-hint {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      font-family: 'Geist Mono', monospace; font-size: 11px;
      padding: 8px 14px; border-radius: 999px;
      background: rgba(20,15,8,0.78); color: #f6efd9;
      letter-spacing: 0.04em; pointer-events: none;
      opacity: 0; transition: opacity .25s ease;
      z-index: 9999;
    }
    .mic-hint.on { opacity: 1; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="mic-hint" class="mic-hint"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="svg-frog.jsx"></script>
  <script type="text/babel" src="frog-agent.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
